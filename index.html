<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RoomCompare</title>
    <meta
      name="description"
      content="Record, organize and compare the boarding houses you have already surveyed."
    />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="icons/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#1f5d4c" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
  </head>
  <body data-auth="pending">
    <a class="skip-link" href="#app-root">Skip to content</a>

    <header class="nav">
      <div class="nav__inner">
        <a class="nav__wordmark" href="#/dashboard">
          <img class="nav__logo" src="icons/logo.svg" alt="" width="32" height="32" />
          <span class="nav__wordmark-text">RoomCompare</span>
        </a>

        <nav class="nav__links" id="nav-links" data-open="false" aria-label="Primary">
          <a class="nav__link" data-nav="surveys" href="#/surveys">My surveys</a>
          <a class="nav__link" data-nav="community" href="#/community">Community</a>
          <a class="nav__link" data-nav="compare" href="#/compare">Compare</a>
          <button class="nav__link nav__logout-menu" type="button" data-action="logout">Log out</button>
        </nav>

        <div class="nav__actions">
          <button
            class="btn btn--secondary nav__toggle"
            type="button"
            data-action="toggle-nav"
            aria-controls="nav-links"
            aria-expanded="false"
            aria-label="Menu"
          >
            <svg class="nav__toggle-icon" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M3 5h14M3 10h14M3 15h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
          <button class="btn btn--quiet nav__logout" type="button" data-action="logout">Log out</button>
          <a class="btn btn--primary" href="#/surveys/new">Add survey</a>
        </div>
      </div>
    </header>

    <div class="column column--notice" id="storage-notice" role="status" aria-live="polite"></div>

    <main class="column" id="app-root" tabindex="-1"><p class="meta">Loading…</p></main>

    <dialog class="dialog" id="app-dialog" aria-modal="true"></dialog>
    <dialog class="lightbox-dialog" id="app-lightbox" aria-modal="true" aria-label="Photo viewer"></dialog>
    <dialog class="dialog dialog--wide" id="app-filters" aria-modal="true" aria-labelledby="filter-dialog-title"></dialog>
    <dialog class="dialog dialog--wide dialog--picker" id="app-picker" aria-modal="true" aria-labelledby="picker-dialog-title"></dialog>
    <dialog class="dialog dialog--wide dialog--criteria" id="app-criteria" aria-modal="true" aria-labelledby="criteria-dialog-title"></dialog>
    <dialog class="dialog dialog--howto" id="app-howto" aria-modal="true" aria-labelledby="howto-title"></dialog>
    <dialog class="dialog dialog--wide dialog--guide" id="app-survey-guide" aria-modal="true" aria-labelledby="survey-guide-title"></dialog>
    <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
