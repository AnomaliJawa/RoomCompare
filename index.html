<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RoomCompare</title>
    <meta
      name="description"
      content="Record, organize and compare the boarding houses you have already surveyed."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
  </head>
  <body>
    <a class="skip-link" href="#app-root">Skip to content</a>

    <header class="nav">
      <div class="nav__inner">
        <a class="nav__wordmark" href="#/dashboard">RoomCompare</a>

        <nav class="nav__links" id="nav-links" data-open="false" aria-label="Primary">
          <a class="nav__link" data-nav="surveys" href="#/surveys">My surveys</a>
          <a class="nav__link" data-nav="community" href="#/community">Community</a>
          <a class="nav__link" data-nav="compare" href="#/compare">Compare</a>
        </nav>

        <div class="nav__actions">
          <button
            class="btn btn--secondary btn--small nav__toggle"
            type="button"
            data-action="toggle-nav"
            aria-controls="nav-links"
            aria-expanded="false"
          >Menu</button>
          <a class="btn btn--primary" href="#/surveys/new">Add survey</a>
        </div>
      </div>
    </header>

    <div class="column column--notice" id="storage-notice" role="status" aria-live="polite"></div>

    <main class="column" id="app-root" tabindex="-1"></main>

    <dialog class="dialog" id="app-dialog" aria-modal="true"></dialog>
    <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
